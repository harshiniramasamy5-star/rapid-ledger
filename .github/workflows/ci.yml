name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-tests:
    name: API + Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapid
          POSTGRES_PASSWORD: rapid
          POSTGRES_DB: rapid_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rapid:rapid@localhost:5432/rapid_ledger_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-refresh-secret-do-not-use-in-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: API tests
        run: npm run test -w apps/api
      - name: Frontend unit tests
        run: npm run test -w apps/web
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint --workspaces --if-present

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: api-tests

    env:
      NEXT_PUBLIC_API_URL: https://rapid-ledger-production.up.railway.app
      BASE_URL: ${{ secrets.VERCEL_URL || 'https://rapid-ledger.vercel.app' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e -w apps/web
        timeout-minutes: 10
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
