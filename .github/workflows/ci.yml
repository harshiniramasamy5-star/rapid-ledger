name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rapid_ledger_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/rapid_ledger_ci"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/rapid_ledger_ci"

      - name: Seed test database
        run: cd apps/api && npx tsx src/seed.ts
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/rapid_ledger_ci"

      - name: TypeScript — check all workspaces
        run: npm run typecheck

      - name: ESLint — check all workspaces
        run: npm run lint

      - name: Tests — API
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/rapid_ledger_ci"
          JWT_SECRET: "ci-test-secret-do-not-use-in-production"
          NODE_ENV: "test"

      - name: Tests — Web
        run: npm run test --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
